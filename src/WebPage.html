<!DOCTYPE html>
<html>
    <title>Polyester Block</title>
    <style>
        title {
            color: #333;
            align-items: center;
            margin-left: 100px;
        }

        body {
            background-image: url("../Images/WebPageBg.png");
            background-size: cover;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            text-align: left;
            padding-top: 50px;
            height: 50vh;
            width: 125vw;
            overflow: hidden;
        }

        h1 {
            color: #ffffff;
            align-items: center;
            justify-content: center;
            margin-left: 500px;
            font-size: 64px;
            margin-top: -50px;
        }

        h2 {
            color: #ffffff;
            align-items: right;
            margin-left: 1000px;    
            transform: translateY(-460%);
        }

        h3 {
            color: #ffffff;
            align-items: left;
            margin-left: 100px;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        label {
            color: #ffffff;
            align-items: left;
            margin-left: 100px;
        }

        #videoBounce {
            position: absolute;
            z-index: 1000;
            width: 320px;
            border-radius: 12px;
        }

        #blacklist{
            color: #000000;
            border-color: #ffffff;
            transform: translateY(-550%);
        }

        .bl {
            color: #ffffff;
            margin-left: 1000px;
            transform: translateY(-460%);
            position: relative;
            border-color: #ffffff;
            bottom: 115px;
        }

        #submitBlacklist {
            transform: translateY(-550%);
        }
    </style>
    <body>
        <h1>Polyester Block</h1>
        <h3>White list: </h3>
        <label for="whitelist">Enter websites to whitelist:</label>
        <input type="url" id="whitelist" name="whitelist" placeholder="Enter website URL">
        <button id = "submitWhitelist">Submit URL</button>
        <h3>Add Links to be left alone: </h3>
        <h3>Submitting link in list removes it from whitelist: </h3>

        <h2>Black List: </h2>
        <h2></h2>
        <label class="bl" for="blacklist">Enter websites to blacklist:</label>
        <input type="url" id="blacklist" name="blacklist" placeholder="Enter website URL">
        <button id = "submitBlacklist">Submit URL</button>
        <h2>Add Links to be incapacitated: </h2>
        <h2>Submitting link in list removes it from blacklist:</h2>

        <video controls autoplay loop playsinline id="videoBounce">
                <source src="../Videos/PolyNormal.mp4" type="video/mp4">
        </video>

        <script src = "VidBounce.js"></script>
        <script src = "SaveURL.js"></script>
    </body>
</html>
